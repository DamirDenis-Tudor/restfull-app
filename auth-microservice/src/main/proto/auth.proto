syntax = "proto3";

package api.academia;

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(TokenRequest) returns (TokenValidResponse);
  rpc InvalidateToken(TokenRequest) returns (InvalidateTokenResponse);
}

/* - login messages - */
message LoginRequest {
  string username = 1;
  string password = 2;
}

message TokenLoginResponse {
  string token = 1;
  string message = 2;
  string role = 3;
}

message LoginResponse {
  oneof result {
    TokenLoginResponse success = 1;
    ErrorResponse error = 2;
  }
}

/* - validate messages - */
message TokenRequest {
  string token = 1;
}

message TokenValid {
  Role role = 1;
  string id = 2;
}

message TokenValidResponse {
  oneof result {
    TokenValid success = 1;
    ErrorResponse error = 2;
  }
}

/* - invalidate messages - */
message InvalidateTokenResponse {
  oneof result {
    string success = 1;
    ErrorResponse error = 2;
  }
}

/* - error response */
message ErrorResponse {
  string exception = 1;
  string message = 2;
}

/* - enums - */
enum Role {
  UNKNOWN = 0;
  ADMIN = 1;
  STUDENT = 2;
  PROFESSOR = 3;
}
