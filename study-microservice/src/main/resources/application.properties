spring.application.name=StudyMicroservice

spring.datasource.url=jdbc:mysql://${STUDY_DB_HOST:localhost}:${STUDY_DB_PORT:3306}/${STUDY_DB_NAME:study-database}
spring.datasource.username=${STUDY_DB_USER:user}
spring.datasource.password=${STUDY_DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.lectures.host.address=${LECTURE_MS_HOST_ADDRESS:http://localhost:8000}
spring.lectures.host.hateoas=http://localhost:8000
spring.auth.hostname=${AUTH_MS_HOSTNAME:localhost}
spring.study.host.hateoas=http://localhost:8080
logging.level.org.apache.coyote.http11.Http11Processor=DEBUG


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.jpa.repositories.enabled=true

server.servlet.context-path=/api/academia

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework=INFO

spring.jpa.properties.javax.persistence.validation.mode=auto
