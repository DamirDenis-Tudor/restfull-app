openapi: 3.0.1
info:
  title: Study Microservice API
  description: "This is the API for the Study Microservice, providing information\
    \ about the service."
  version: 1.0.0
servers:
- url: http://localhost:8080/api/academia
  description: Generated server url
paths:
  /lectures:
    get:
      tags:
      - lecture-controller
      summary: Get list of lectures
      description: Returns a paginated list of lectures.
      operationId: getLectures
      parameters:
      - name: page
        in: query
        required: false
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          maximum: 30
          minimum: 1
          type: integer
          format: int32
          default: 5
      responses:
        "200":
          description: List of lectures
          content:
            application/hal+json: {}
        "401":
          description: Unauthorized
          content:
            application/json: {}
        "403":
          description: Forbidden
          content:
            application/json: {}
        "404":
          description: Not Found
          content:
            application/json: {}
        "416":
          description: Parameter range is out of bounds
          content:
            application/json: {}
        "422":
          description: Unprocessable entity (invalid parameters)
          content:
            application/json: {}
        "503":
          description: Authorization service is unavailable
          content:
            application/json: {}
    put:
      tags:
      - lecture-controller
      summary: Create a new lecture
      description: Creates a new lecture based on the provided information.
      operationId: createLecture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LectureCreate"
        required: true
      responses:
        "201":
          description: Lecture created successfully
          content:
            application/hal+json: {}
        "401":
          description: Unauthorized
          content:
            application/json: {}
        "403":
          description: Forbidden
          content:
            application/json: {}
        "409":
          description: Conflict
          content:
            application/json: {}
        "416":
          description: Parameter range is out of bounds
          content:
            application/json: {}
        "422":
          description: Unprocessable entity (invalid parameters)
          content:
            application/json: {}
        "503":
          description: Authorization service is unavailable
          content:
            application/json: {}
  /students:
    get:
      tags:
      - student-controller
      summary: Get all students
      description: Retrieves a paginated list of all students.
      operationId: getAllStudents
      parameters:
      - name: page
        in: query
        required: false
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          maximum: 30
          minimum: 1
          type: integer
          format: int32
          default: 5
      responses:
        "200":
          description: List of students
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
          content:
            application/json: {}
        "404":
          description: Not Found
          content:
            application/json: {}
        "416":
          description: Returned when any parameter does not match the expected type.
          content:
            application/json: {}
        "422":
          description: Returned when parameter is not expected type..
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
    post:
      tags:
      - student-controller
      summary: Create a new student
      description: Creates a new student record.
      operationId: createStudent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentCreate"
        required: true
      responses:
        "201":
          description: Student created
          content:
            application/hal+json: {}
        "400":
          description: Invalid student data
          content:
            application/json: {}
        "401":
          description: "Unauthorized, token invalid or missing"
          content:
            application/json: {}
        "403":
          description: "Forbidden, user does not have necessary permissions"
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
  /students/{studentId}/lectures/{lectureId}:
    get:
      tags:
      - student-lecture-controller
      summary: Get a specific lecture for a student
      description: Retrieves a specific lecture for a student by their lecture ID.
      operationId: getLectureByStudent
      parameters:
      - name: lectureId
        in: path
        required: true
        schema:
          maximum: 999
          minimum: 100
          type: integer
          format: int32
      - name: studentId
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      responses:
        "200":
          description: Lecture details
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
          content:
            application/json: {}
        "416":
          description: Returned when any parameter does not match the expected type.
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
    post:
      tags:
      - student-lecture-controller
      summary: Enroll a student in a lecture
      description: Enrolls a student in a specific lecture.
      operationId: enrollStudentInLecture
      parameters:
      - name: studentId
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      - name: lectureId
        in: path
        required: true
        schema:
          maximum: 999
          minimum: 100
          type: integer
          format: int32
      responses:
        "200":
          description: Enrollment success
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
          content:
            application/json: {}
        "404":
          description: Lecture or Student not found.
          content:
            application/json: {}
        "409":
          description: If student is already enrolled.
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
    delete:
      tags:
      - student-lecture-controller
      summary: Unroll a student from a lecture
      description: Unenrolls a student from a specific lecture.
      operationId: unrollStudentFromLecture
      parameters:
      - name: studentId
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      - name: lectureId
        in: path
        required: true
        schema:
          maximum: 999
          minimum: 100
          type: string
      responses:
        "200":
          description: Unenrollment success
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
          content:
            application/json: {}
        "404":
          description: Lecture or Student not found.
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
  /professors:
    get:
      tags:
      - professor-controller
      summary: Get all professors
      description: Retrieves a paginated list of all professors.
      operationId: getAllProfessors
      parameters:
