  /students/search:
    get:
      tags:
      - student-search-controller
      summary: Search for students based on various criteria
      description: "Searches for students using first name, last name, email, cycle\
        \ type, study year, or student group. Supports pagination."
      operationId: searchStudents
      parameters:
      - name: firstName
        in: query
        description: First name of the student to search for
        required: false
        schema:
          maxLength: 15
          minLength: 3
          type: string
        example: John
