            application/json: {}
    patch:
      tags:
      - professor-controller
      summary: Update a professor's information
      description: Updates an existing professor's details.
      operationId: patchProfessor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessorUpdate"
        required: true
      responses:
        "200":
          description: Professor updated successfully
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
