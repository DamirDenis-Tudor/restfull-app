          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          maximum: 30
          minimum: 1
          type: integer
          format: int32
          default: 5
      responses:
        "200":
          description: List of professors
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
          content:
            application/json: {}
        "404":
          description: Not Found
          content:
            application/json: {}
        "416":
          description: Returned when any parameter does not match the expected range.
          content:
            application/json: {}
        "422":
          description: Returned when parameter is not expected type.
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
    post:
      tags:
      - professor-controller
      summary: Create a new professor
      description: Creates a new professor in the system.
      operationId: createProfessor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessorCreate"
        required: true
      responses:
        "201":
          description: Professor created successfully
          content:
            application/hal+json: {}
        "401":
          description: Authorization header missing or invalid
          content:
            application/json: {}
        "403":
          description: Current user role is not allowed to this endpoint.
          content:
            application/json: {}
        "409":
          description: Conflict
          content:
            application/json: {}
        "416":
          description: Returned when any parameter does not match the expected range.
          content:
            application/json: {}
        "422":
          description: "Bad request: Invalid data provided"
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
  /students/{id}:
    get:
      tags:
      - student-controller
      summary: Get a student by ID
      description: "Retrieves a student by ID, requires the student email to be injected\
        \ from the JWT token constraints if the user is a student."
      operationId: getStudent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      responses:
        "200":
          description: Student found
          content:
            application/hal+json: {}
        "401":
          description: "Unauthorized, token invalid or missing"
          content:
            application/json: {}
        "403":
          description: "Forbidden, user does not have the necessary permissions"
          content:
            application/json: {}
        "404":
          description: Student not found
          content:
            application/json: {}
        "422":
          description: Invalid ID parameter provided
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
    delete:
      tags:
      - student-controller
      summary: Delete a student
      description: Deletes a student record by ID.
      operationId: deleteStudent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      responses:
        "204":
          description: Student deleted
          content:
            application/json: {}
        "401":
          description: "Unauthorized, token invalid or missing"
          content:
            application/json: {}
        "403":
          description: "Forbidden, user does not have necessary permissions"
          content:
            application/json: {}
        "404":
          description: Student not found
          content:
            application/json: {}
        "416":
          description: Invalid parameters ranges
          content:
            application/json: {}
        "422":
          description: Invalid parameter data
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
    patch:
      tags:
      - student-controller
      summary: Update an existing student
      description: Updates a student's record by ID.
      operationId: updateStudent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
          minimum: 0
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
        required: true
      responses:
        "200":
          description: Student updated
          content:
            application/hal+json: {}
        "400":
          description: "Bad request, invalid data format"
          content:
            application/json: {}
        "416":
          description: Invalid parameters ranges
          content:
            application/json: {}
        "422":
          description: Invalid student data
          content:
            application/json: {}
        "403":
          description: Forbidden
          content:
            application/json: {}
        "404":
          description: Student not found
          content:
            application/json: {}
        "409":
          description: Conflict
          content:
            application/json: {}
        "503":
          description: Returned when the authorization service is not available.
          content:
            application/json: {}
  /professors/{id}:
    get:
      tags:
      - professor-controller
      summary: Get a specific professor by ID
      description: Fetches details of a specific professor identified by ID.
      operationId: getProfessor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maximum: 9223372036854775807
