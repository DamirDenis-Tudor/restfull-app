services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=study-database'
      - 'MYSQL_PASSWORD=password'
      - 'MYSQL_ROOT_PASSWORD=root-password'
      - 'MYSQL_USER=user'
    ports:
      - '3306:3306'
    volumes:
      - .scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - .scripts/insert.sql:/docker-entrypoint-initdb.d/insert.sql